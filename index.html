<style>
:root{
  --bg:#000;
  --ink:#ece6e1;
  --dim:#8c8480;
  --line:#2a2220;
  --ember:#ff5a36;
}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{
  background:var(--bg);color:var(--ink);
  font:400 17px/1.65 "IBM Plex Sans",system-ui,sans-serif;
  min-height:100vh;
}
a{color:inherit}
:focus-visible{outline:2px solid var(--ember);outline-offset:3px}
.wrap{max-width:760px;margin:0 auto;padding:0 24px}
nav{display:flex;justify-content:space-between;align-items:center;padding:28px 0}
nav .brand{font:800 20px "Syne",sans-serif;text-decoration:none;letter-spacing:.02em}
nav ul{list-style:none;display:flex;gap:28px;padding:0}
nav a{color:var(--dim);text-decoration:none;transition:color .2s}
nav a:hover{color:var(--ink)}
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:32px;padding:32px 0 80px}
.pfp{width:200px;height:200px;max-width:100%;object-fit:cover;object-position:55% 38%;display:block;border-radius:50%;box-shadow:0 0 0 1px var(--line),0 0 70px rgba(255,90,54,.3)}
h1{font:800 clamp(52px,10vw,92px)/.95 "Syne",sans-serif;letter-spacing:-.02em}
section{padding:56px 0;border-top:1px solid var(--line)}
h2{font:700 28px "Syne",sans-serif;margin-bottom:18px}
p+p{margin-top:14px}
.wbtn{
  display:flex;justify-content:space-between;align-items:center;width:100%;
  background:none;color:var(--ink);border:1px solid var(--line);border-radius:6px;
  padding:20px 22px;font:500 17px "IBM Plex Sans",sans-serif;cursor:pointer;
  transition:border-color .2s,background .2s;
}
.wbtn:hover{border-color:var(--ember);background:#0d0706}
.wbtn .chev{color:var(--ember);transition:transform .25s}
.wbtn[aria-expanded="true"] .chev{transform:rotate(90deg)}
.wpanel{display:none;border:1px solid var(--line);border-top:0;border-radius:0 0 6px 6px;padding:22px}
.wpanel.open{display:block}
.wpanel .soon{color:var(--ember);font-weight:500}
.wpanel p{color:var(--dim);margin-top:6px}
footer{padding:40px 0 60px;color:var(--dim);font-size:14px;border-top:1px solid var(--line)}
@media(max-width:620px){nav ul{gap:18px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
